name: POCUS Weekly Digest

on:
  workflow_dispatch:  # Lancio manuale e da cron-job.org
    inputs:
      dry_run:
        description: "Prova a vuoto: esegue tutto ma NON invia email ne' Telegram"
        type: boolean
        default: false

# Evita doppi invii se cron-job.org spara due trigger ravvicinati:
# il secondo run attende (non cancella) ma non gira in parallelo.
concurrency:
  group: newsletter-pocus-invio
  cancel-in-progress: false

env:
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  GMAIL_USER_POCUS: ${{ secrets.GMAIL_USER_POCUS }}
  GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  # Vuoto quando il workflow parte da cron-job.org: l'invio resta il default.
  DRY_RUN: ${{ inputs.dry_run && '1' || '' }}

jobs:
  send-newsletter:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Nessuna dipendenza esterna: lo script usa solo la libreria standard
      # (invio via SMTP con smtplib).

      - name: Run newsletter
        run: python newsletter_pocus.py

      # Caricato anche quando lo step precedente fallisce: il log e' proprio
      # cio' che serve quando qualcosa e' andato storto.
      - name: Carica anteprima e log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digest-pocus-${{ github.run_number }}
          path: |
            anteprima_digest.html
            newsletter_pocus.log
          if-no-files-found: warn
          retention-days: 30
