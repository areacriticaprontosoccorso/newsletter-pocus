name: POCUS Weekly Digest

on:
  pull_request:
    paths:
      - 'corsi.py'
      - 'corsi.json'
      - 'corsi.esempio.json'
      - 'newsletter_pocus.py'
      - 'pocus_search.py'
      - 'config.py'
      - 'tests/**'
      - '.github/workflows/newsletter_pocus.yml'
  workflow_dispatch:  # Lancio manuale e da cron-job.org
    inputs:
      dry_run:
        description: "Prova a vuoto: esegue tutto ma NON invia email ne' Telegram"
        type: boolean
        default: false
      solo_facebook:
        description: "Solo Facebook: pubblica i post ma NON invia email ne' Telegram"
        type: boolean
        default: false

# Evita doppi invii se cron-job.org spara due trigger ravvicinati:
# il secondo run attende (non cancella) ma non gira in parallelo.
concurrency:
  group: newsletter-pocus-invio
  cancel-in-progress: false

env:
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  GMAIL_USER_POCUS: ${{ secrets.GMAIL_USER_POCUS }}
  GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  # Vuoto quando il workflow parte da cron-job.org: l'invio resta il default.
  DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
  SOLO_FACEBOOK: ${{ inputs.solo_facebook && '1' || '' }}
  FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
  FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}

jobs:
  tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - name: Controlla corsi.json
        # Non blocca l'invio: un errore compare come avviso giallo nel riepilogo del run.
        continue-on-error: true
        run: python corsi.py

  send-newsletter:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Nessuna dipendenza esterna: lo script usa solo la libreria standard
      # (invio via SMTP con smtplib).

      - name: Installa Playwright
        run: |
          pip install playwright==1.49.0
          playwright install --with-deps chromium

      - name: Verifica test offline
        run: python -m unittest discover -s tests -v

      - name: Controlla corsi.json
        # Non blocca l'invio: un errore compare come avviso giallo nel riepilogo del run.
        continue-on-error: true
        run: python corsi.py

      - name: Run newsletter
        run: python newsletter_pocus.py

      # Caricato anche quando lo step precedente fallisce: il log e' proprio
      # cio' che serve quando qualcosa e' andato storto.
      - name: Carica anteprima e log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digest-pocus-${{ github.run_number }}
          path: |
            anteprima_digest.html
            newsletter_pocus.log
            immagini/
            post_facebook.txt
            post_gruppo.txt
          if-no-files-found: warn
          retention-days: 30
