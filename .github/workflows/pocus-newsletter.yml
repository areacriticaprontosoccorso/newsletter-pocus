name: POCUS Weekly Digest

on:
  # Ogni venerdì alle 08:00 ora di Roma (Europe/Rome)
  # GitHub Actions usa solo UTC, quindi scheduliamo a entrambi gli orari
  # per coprire ora legale e ora solare:
  #   06:00 UTC = 08:00 CEST (ultima dom marzo – ultima dom ottobre)
  #   07:00 UTC = 08:00 CET  (ultima dom ottobre – ultima dom marzo)
  # Lo step "Check timezone" salta l'esecuzione duplicata.
  schedule:
    - cron: "0 6 * * 5"
    - cron: "0 7 * * 5"

  workflow_dispatch:

env:
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  GMAIL_TOKEN_POCUS: ${{ secrets.GMAIL_TOKEN_POCUS }}

jobs:
  send-newsletter:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check timezone
        id: tz
        run: |
          ROME_HOUR=$(TZ="Europe/Rome" date +%H)
          echo "rome_hour=$ROME_HOUR" >> "$GITHUB_OUTPUT"
          if [ "$ROME_HOUR" != "08" ]; then
            echo "Ora di Roma: $ROME_HOUR — non sono le 08, skip."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Ora di Roma: $ROME_HOUR — eseguo."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.tz.outputs.skip == 'false'
        uses: actions/checkout@v4

      - name: Setup Python
        if: steps.tz.outputs.skip == 'false'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.tz.outputs.skip == 'false'
        run: |
          pip install --upgrade pip
          pip install google-auth google-auth-oauthlib google-api-python-client

      - name: Run newsletter
        if: steps.tz.outputs.skip == 'false'
        run: python newsletter_pocus.py

      - name: Upload log as artifact
        if: always() && steps.tz.outputs.skip == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: newsletter-log-${{ github.run_id }}
          path: "*.log"
          retention-days: 30
